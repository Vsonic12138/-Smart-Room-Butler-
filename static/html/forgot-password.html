<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <title>酒店管理系统 - 重置密码</title>
    <link rel="stylesheet" href="/static/css/style.css">
</head>
<body>
    <div class="login-container">
        <h2>重置密码申请</h2>
        <form id="resetForm" onsubmit="handleResetRequest(event)">
            <div class="input-group">
                <input type="text" id="username" placeholder="用户名" required>
            </div>
            <div class="input-group">
                <textarea id="reason" placeholder="请说明重置密码的原因" required></textarea>
            </div>
            <button type="submit" class="primary-btn">提交申请</button>
            <button type="button" class="secondary-btn" onclick="window.location.href='login.html'">返回登录</button>
        </form>
    </div>
    <script src="/static/js/forgot-password.js"></script>
</body>
</html>
