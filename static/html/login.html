<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <title>酒店管理系统 - 登录</title>
    <link rel="stylesheet" href="/static/css/style.css">
</head>
<body>
    <div class="login-container">
        <h2>酒店管理系统</h2>
        <div class="login-type-selector">
            <button class="type-btn active" onclick="switchLoginType('admin')">管理员登录</button>
            <button class="type-btn" onclick="switchLoginType('customer')">客户登录</button>
        </div>
        <form id="loginForm">
            <div class="input-group">
                <input type="text" id="username" placeholder="用户名" required>
            </div>
            <div class="input-group">
                <input type="password" id="password" placeholder="密码" required>
            </div>
            <button type="submit" class="primary-btn">登录</button>
        </form>
        <div id="registerSection" style="display: none;">
            <button onclick="showRegister()" class="secondary-btn">注册新用户</button>
        </div>
         <!-- <div class="additional-links">
            <a href="#" id="forgotPasswordLink" style="display: none;">忘记密码？</a>
        </div> -->
    </div>
    <script src="/static/js/login.js"></script>
</body>
</html>
